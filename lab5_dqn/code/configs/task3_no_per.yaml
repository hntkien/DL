# Lab 5 — Task 3 Ablation: DDQN + n-step, NO Prioritized Replay
# Run from lab5_dqn/ project root:
#     bash code/train_task3.sh --config code/configs/task3_no_per.yaml

# Env / I/O
env_name: ALE/Pong-v5
save_dir: ./results/task3_no_per
wandb_project: DLP-Lab5-DQN-Pong
wandb_run_name: task3-ablation-no-per
episodes: 3000

# Optimization / replay
batch_size: 32
memory_size: 300000
lr: 1.0e-4
discount_factor: 0.99
grad_clip: 10.0

# Exploration
epsilon_start: 1.0
epsilon_decay: 0.999996
epsilon_min: 0.01

# Training schedule
target_update_frequency: 5000
replay_start_size: 50000
max_episode_steps: 27000
train_per_step: 1

# Evaluation
num_eval_episodes: 20
best_reward_init: -21.0

# Enhancements — PER OFF (uniform replay)
use_ddqn: true
use_per: false
n_step: 3
per_alpha: 0.6
per_beta_start: 0.4
per_beta_anneal_steps: 1000000
loss_type: huber

# Atari env-side wrappers (NEW)
disable_sticky_actions: true     # repeat_action_probability=0.0
pong_action_subset: true         # {NOOP, RIGHT, LEFT} only

# Task 3 grading
score_threshold: 19.0
snapshot_steps: [600000, 800000, 1000000, 1250000, 1500000, 2000000, 2500000, 3000000]